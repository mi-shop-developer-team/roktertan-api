<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#eff6ff">
  <meta name="description" content="আমাদের ওয়েবসাইটের রক্ষণাবেক্ষণের কাজ চলছে। ইনশাআল্লাহ, খুব শিগগিরই আমরা ফিরে আসব।">

  <title>Website Under Maintenance</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, "Noto Sans Bengali", sans-serif;
      background:
        radial-gradient(circle at top left, #dbeafe, transparent 45%),
        radial-gradient(circle at bottom right, #e0e7ff, transparent 40%),
        #f8fafc;
      color: #172554;
    }

    .maintenance-card {
      width: 100%;
      max-width: 560px;
      padding: 42px 28px;
      text-align: center;
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid #ffffff;
      border-radius: 28px;
      box-shadow: 0 20px 60px rgba(37, 99, 235, 0.12);
      animation: fadeIn 0.8s ease;
    }

    .icon-circle {
      width: 100px;
      height: 100px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #dbeafe, #bfdbfe);
      border-radius: 50%;
      font-size: 46px;
      animation: float 3s ease-in-out infinite;
    }

    .status {
      display: inline-block;
      padding: 9px 15px;
      background: #eff6ff;
      color: #2563eb;
      border: 1px solid #dbeafe;
      border-radius: 30px;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 6px;
      background: #f59e0b;
      border-radius: 50%;
      animation: blink 1.5s infinite;
    }

    h1 {
      margin: 24px 0 15px;
      color: #1e3a8a;
      font-size: clamp(27px, 6vw, 38px);
      font-weight: 800;
      line-height: 1.5;
    }

    .description {
      max-width: 430px;
      margin: 0 auto;
      color: #64748b;
      font-size: 15px;
      line-height: 2;
    }

    .return-message {
      margin: 28px 0 24px;
      padding: 20px 14px;
      background: linear-gradient(135deg, #eff6ff, #f5f3ff);
      border: 1px solid #dbeafe;
      border-radius: 18px;
    }

    .return-message .emoji {
      display: block;
      margin-bottom: 8px;
      font-size: 27px;
    }

    .return-message p {
      color: #1d4ed8;
      font-size: 17px;
      font-weight: 700;
      line-height: 1.9;
    }

    .progress-track {
      width: 100%;
      max-width: 230px;
      height: 6px;
      margin: 0 auto 24px;
      overflow: hidden;
      background: #dbeafe;
      border-radius: 20px;
    }

    .progress-bar {
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, #2563eb, #818cf8);
      border-radius: 20px;
      animation: loading 2s ease-in-out infinite;
    }

    .footer {
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.8;
    }

    .footer strong {
      color: #64748b;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-9px);
      }
    }

    @keyframes blink {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.3;
      }
    }

    @keyframes loading {
      0% {
        transform: translateX(-120%);
      }
      100% {
        transform: translateX(350%);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 15px;
      }

      .maintenance-card {
        padding: 32px 19px;
        border-radius: 22px;
      }

      .icon-circle {
        width: 85px;
        height: 85px;
        font-size: 39px;
      }

      .description {
        font-size: 14px;
      }

      .return-message p {
        font-size: 15px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <main class="maintenance-card">

    <div class="icon-circle" aria-hidden="true">
      🛠️
    </div>

    <div class="status">
      <span class="status-dot"></span>
      WEBSITE UNDER MAINTENANCE
    </div>

    <h1>আমরা কাজ করছি!</h1>

    <p class="description">
      আমাদের ওয়েবসাইটে বর্তমানে রক্ষণাবেক্ষণের কাজ চলছে।
      আপনাদের আরও সুন্দর, উন্নত ও মানসম্মত অভিজ্ঞতা দেওয়ার
      জন্য আমরা কাজ করছি।
    </p>

    <div class="return-message">
      <span class="emoji" aria-hidden="true">✨</span>
      <p>
        ইনশাআল্লাহ, খুব শিগগিরই<br>
        আমরা ফিরে আসব!
      </p>
    </div>

    <div class="progress-track" aria-label="রক্ষণাবেক্ষণের কাজ চলছে">
      <div class="progress-bar"></div>
    </div>

    <p class="footer">
      আমাদের সঙ্গে থাকার জন্য ধন্যবাদ ❤️<br>
      <strong>We will be back soon!</strong>
    </p>

  </main>
</body>
</html>
